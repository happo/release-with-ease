name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The tests run `.ts` straight from source through Node's type
        # stripping, which needs 22.18 or newer. The published package is
        # compiled JavaScript and is checked against the `engines` floor by
        # the `build` job below.
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm tsc

      - name: Test
        run: pnpm test

  build:
    name: Build and run on the oldest supported Node
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # The bin shim is what `npx release-with-ease` runs, and it only ever
      # loads compiled output — so check the whole import chain parses and
      # runs on the version `engines` promises, not just on the newest Node.
      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Run the compiled CLI on Node 20
        run: |
          set -e
          node --version
          output=$(node bin/release-with-ease.js --dry-run 2>&1) && status=0 || status=$?
          echo "$output"
          if [ "$status" -ne 1 ]; then
            echo "Expected exit status 1, got $status" >&2
            exit 1
          fi
          case "$output" in
            *ANTHROPIC_API_KEY*) ;;
            *) echo "CLI did not reach its first check" >&2; exit 1 ;;
          esac
